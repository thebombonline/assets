# Installed in every thebombonline repo by thebombonline/claude-review-sync: change it there, not here.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    # A person asking, not a bot: the review's own summary says "@claude fix the P1s" as a how-to.
    if: contains(github.event.comment.body, '@claude') && !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
